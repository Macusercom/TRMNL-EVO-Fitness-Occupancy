---
strategy: polling
no_screen_padding: 'no'
dark_mode: 'no'
static_data: ''
polling_verb: get
framework_version:
serverless_language:
refresh_interval_floor:
polling_url: |-
  {%- assign gym = gym_at -%}{%- if country == "de" -%}{%- assign gym = gym_de -%}{%- elsif country == "ch" -%}{%- assign gym = gym_ch -%}{%- endif -%}
  {%- assign off = trmnl.user.utc_offset | default: 3600 -%}
  {%- assign tomorrow = "now" | date: "%s" | plus: off | plus: 86400 | date: "%Y-%m-%d" -%}
  https://visits.evofitness.at/api/v1/locations/{{ gym }}/current
  https://visits.evofitness.at/api/v1/locations/{{ gym }}/timeline
  https://visits.evofitness.at/api/v1/locations/{{ gym }}/timeline?date={{ tomorrow }}
polling_headers:
polling_body:
id: 538821
oauth_enabled: 'false'
oauth_pkce_enabled: 'no'
custom_fields:
- keyname: about
  name: About This Plugin
  field_type: author_bio
  category: sports,life
  description: 'Shows how busy your EVO Fitness gym is right now: live headcount, today''s occupancy per time slot, the quietest slot still ahead and tomorrow''s forecast. Works for EVO gyms in Austria, Germany and Switzerland (German gyms: live occupancy only, EVO publishes no usable time-slot data for them).<br/><br/>To show several gyms on one screen, add the plugin once per gym and combine the instances in a Mashup.<br/><br/>Unofficial plugin by Christoph (<a href="https://github.com/Macusercom" target="_blank">Macusercom</a>), not affiliated with EVO Fitness. Data from EVO''s public occupancy pages, e.g. <a href="https://visits.evofitness.at" target="_blank">visits.evofitness.at</a>.'
  github_url: https://github.com/Macusercom/TRMNL-EVO-Fitness-Occupancy
  learn_more_url: https://visits.evofitness.at
- keyname: country
  field_type: select
  name: Country
  description: Country of your EVO Fitness gym
  default: at
  options:
  - Austria: at
  - Germany: de
  - Switzerland: ch
  conditional_validation:
  - when: at
    visible:
    - gym_at
    required:
    - gym_at
  - when: de
    visible:
    - gym_de
    required:
    - gym_de
  - when: ch
    visible:
    - gym_ch
    required:
    - gym_ch
- keyname: gym_at
