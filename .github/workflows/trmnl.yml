name: TRMNL
on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
      - run: gem install trmnl_preview
      - run: trmnlp lint

  push:
    needs: lint
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # The plugin id is written to src/settings.yml by the first manual
      # `trmnlp push`. Until then there is nothing to update, so skip.
      - id: plugin
        run: grep -q '^id:' src/settings.yml && echo "exists=true" >> "$GITHUB_OUTPUT" || echo "exists=false" >> "$GITHUB_OUTPUT"
      - uses: ruby/setup-ruby@v1
        if: steps.plugin.outputs.exists == 'true'
        with:
          ruby-version: "4.0"
      - if: steps.plugin.outputs.exists == 'true'
        run: gem install trmnl_preview
      - if: steps.plugin.outputs.exists == 'true'
        run: trmnlp push --force
        env:
          TRMNL_API_KEY: ${{ secrets.TRMNL_API_KEY }}
